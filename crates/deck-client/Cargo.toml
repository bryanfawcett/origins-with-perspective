[package]
name = "deck-client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.130"

[dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions",
  "CssStyleDeclaration",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "History",
  "HtmlElement",
  "KeyboardEvent",
  "Location",
  "Node",
  "NodeList",
  "Touch",
  "TouchEvent",
  "TouchList",
  "Window",
]
