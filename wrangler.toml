name = "origins-with-perspective"
main = "worker.js"
compatibility_date = "2025-08-30"

# Static assets configuration for Wrangler 4.x
[assets]
directory = "./dist"
binding = "ASSETS"

# GitHub repository integration
# Cloudflare's GitHub app deploys this Worker directly on push to main.
# Repository: https://github.com/bryanfawcett/origins-with-perspective
# Manual `wrangler deploy` still works if ever needed, but the app is
# the deploy path of record — avoid running both against the same push.
