name = "origins-with-perspective"
compatibility_date = "2026-08-26"

# An assets-only Worker: every route is prerendered, so there is no `main`.
#
# There used to be a worker.js here whose whole job was to strip
# X-Frame-Options and set `frame-ancestors *` so the deck could be embedded.
# It never ran on the deck: static assets are matched before the Worker
# script, so it only executed on paths that were not assets — 404s — where
# framing headers do nothing. The policy now lives in public/_headers, which
# the asset layer reads directly and which actually applies.
# `not_found_handling` is left at its default: this deck is a single page and
# has no 404.html for the asset layer to serve, so setting it would only imply
# a page that does not exist.
[assets]
directory = "./dist"

# GitHub repository integration
# Cloudflare's GitHub app deploys this Worker directly on push to main.
# Repository: https://github.com/bryanfawcett/origins-with-perspective
# Manual `wrangler deploy` still works if ever needed, but the app is
# the deploy path of record — avoid running both against the same push.
