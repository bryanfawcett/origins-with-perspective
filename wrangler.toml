name = "origins-with-perspective"
compatibility_date = "2026-08-26"

# A Rust Worker (crates/deck-worker) in front of the static deck. The compiled output is
# committed in prebuilt-worker/ because Cloudflare's build image has no Rust; ./release.sh
# refreshes it. It runs first (`run_worker_first`) so it sets the embedding headers on every
# response; the assets binding does the serving.
main = "./prebuilt-worker/index.js"
# `not_found_handling` is left at its default: this deck is a single page and
# has no 404.html for the asset layer to serve, so setting it would only imply
# a page that does not exist.
# The deck's own address. A custom domain, not a route: Cloudflare creates the DNS
# record and the certificate when this deploys, since bryanfawcett.com is a zone in
# this account. The workers.dev URL keeps working.
routes = [
  { pattern = "origins-deck.bryanfawcett.com", custom_domain = true },
]

# Wrangler turns the workers.dev address off by default once `routes` is set. Keep it
# on: bryanfawcett.com and any other embed still point at it.
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# The deck is one page: a request for anything else should say so rather than
# be served the talk. `404-page` needs a 404.html in the asset tree, which a
# single-page build has no reason to emit, so `none` is the honest setting —
# the asset layer returns a plain 404 and nothing pretends otherwise.
not_found_handling = "none"

# On, as on bryanfawcett-site: without it a Worker that starts failing does so
# invisibly.
[observability]
enabled = true

# GitHub repository integration
# Cloudflare's GitHub app deploys this Worker directly on push to main.
# Repository: https://github.com/bryanfawcett/origins-with-perspective
# Manual `wrangler deploy` still works if ever needed, but the app is
# the deploy path of record — avoid running both against the same push.
